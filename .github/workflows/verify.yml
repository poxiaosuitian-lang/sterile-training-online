name: Verify online server
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aseptic
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aseptic_training
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aseptic -d aseptic_training"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://aseptic:ci-only-password@localhost:5432/aseptic_training?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run build
      - run: python3 -m unittest discover -s tools -p 'test_update_apk.py'
      - run: sh -n tools/deploy_update.sh
      - run: node tools/test_online_integration.cjs
      - run: docker build -t sterile-training-online:ci .
      - name: Verify migration and repair command in production image
        run: >-
          docker run --rm --network host -e DATABASE_URL -e REDIS_URL
          sterile-training-online:ci sh -c
          'npx prisma migrate deploy && node dist/maintenance/repair-scores.js && node dist/maintenance/repair-scores.js --apply'
