<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>无菌方舟 · 测试管理</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#173f48;background:#eff7f8}body{margin:0}header{background:#124e5b;color:white;padding:24px 5%;display:flex;align-items:center;justify-content:space-between}h1{font-size:24px;margin:0}main{max-width:1250px;margin:30px auto;padding:0 20px}section{background:white;border:1px solid #cee2e5;border-radius:16px;padding:24px;margin-bottom:20px}button,input{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid #afcbd0}button{cursor:pointer;background:#168ca3;color:white}button.secondary{color:#176375;background:#eaf6f8}button:disabled{opacity:.5;cursor:default}input{box-sizing:border-box;max-width:100%}label{display:block;margin:14px 0}label input{display:block;margin-top:6px;width:100%}#login{max-width:400px;margin:8vh auto}.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.scroll{overflow:auto}table{border-collapse:collapse;min-width:850px;width:100%;margin-top:16px}th,td{text-align:left;border-bottom:1px solid #e1edef;padding:12px;white-space:nowrap}th{background:#edf8f9}small,.muted{color:#64818a}#message{white-space:pre-wrap;color:#b33a31;margin:16px 0}progress{accent-color:#168ca3;width:75px}dialog{border:0;border-radius:16px;max-width:90vw;width:1150px;max-height:85vh;padding:24px}dialog::backdrop{background:#092a3999}pre{white-space:pre-wrap;word-break:break-word}.stats{font-size:20px;font-weight:600;margin:16px 0}[hidden]{display:none!important}
</style>
<header><div><h1>无菌方舟 · 测试管理</h1><small style="color:#bcdfe5">玩家完成度与成绩</small></div><button id="logout" hidden class="secondary">退出登录</button></header>
<main><div id="message" role="alert"></div>
<section id="login"><h2>管理员登录</h2><form id="loginForm"><label>账号<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required minlength="8"></label><button id="loginButton">登录后台</button></form></section>
<section id="dashboard" hidden><div class="bar"><input id="search" placeholder="搜索账号或昵称" aria-label="搜索账号或昵称"><button id="refresh">查询 / 刷新</button><button id="export" class="secondary">导出成绩 CSV</button></div><div id="summary" class="stats"></div><div class="scroll"><table><thead><tr><th>账号 / 昵称</th><th>完成度</th><th>总成绩</th><th>已提交 / 已开始</th><th>最近登录</th><th>操作</th></tr></thead><tbody id="players"></tbody></table></div><div class="bar" style="margin-top:20px"><button id="prev" class="secondary">上一页</button><span id="page"></span><button id="next" class="secondary">下一页</button></div></section>
<dialog id="detail"><div class="bar"><h2 id="detailTitle"></h2><button id="closeDetail" class="secondary">关闭</button></div><h3>各关成绩</h3><div class="scroll"><table><thead><tr><th>关卡</th><th>状态</th><th>最高分</th><th>提交次数</th></tr></thead><tbody id="progress"></tbody></table></div><h3>挑战记录</h3><small>用时为客户端记录的本次游戏时长；旧记录可能没有用时。</small><div class="scroll"><table><thead><tr><th>关卡</th><th>状态</th><th>分数</th><th>用时</th><th>开始时间</th><th>提交明细</th></tr></thead><tbody id="sessions"></tbody></table></div><div class="bar" style="margin-top:16px"><button id="sessionPrev" class="secondary">上一页</button><span id="sessionPage"></span><button id="sessionNext" class="secondary">下一页</button></div></dialog>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id), base='/api/v1/admin';
let token=sessionStorage.getItem('adminToken')||'',page=1,currentPlayer=null,sessionPage=1;
function error(e){$('message').textContent=e.message||String(e)}
function showLoggedIn(value){$('login').hidden=value;$('dashboard').hidden=!value;$('logout').hidden=!value}
async function request(path,options={}){const r=await fetch(base+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...options.headers}});if(!r.ok){if(r.status===401){token='';sessionStorage.removeItem('adminToken');showLoggedIn(false);$('detail').close()}let message='请求失败';try{message=(await r.json()).message}catch{}throw Error(Array.isArray(message)?message.join('；'):message)}return r}
function cell(row,value){const c=document.createElement('td');c.textContent=value??'—';row.append(c);return c}
function date(value){return value?new Date(value).toLocaleString('zh-CN'):'—'}
async function load(){ $('message').textContent=''; const data=await(await request('/players?search='+encodeURIComponent($('search').value)+'&page='+page)).json();$('players').replaceChildren();$('summary').textContent='共 '+data.total+' 位玩家';$('page').textContent=page+' / '+Math.max(1,Math.ceil(data.total/50));$('prev').disabled=page<=1;$('next').disabled=page*50>=data.total;for(const p of data.players){const row=document.createElement('tr');cell(row,p.username+' / '+p.nickname);cell(row,p.completed+'/5 关 · '+p.completionRate+'%');cell(row,p.totalScore);cell(row,p._count.scoreEvents+' / '+p._count.sessions);cell(row,date(p.lastLoginAt));const action=cell(row,'');const button=document.createElement('button');button.textContent='查看详情';button.onclick=()=>openPlayer(p).catch(error);action.append(button);$('players').append(row)}}
async function openPlayer(p){currentPlayer=p;sessionPage=1;$('detailTitle').textContent=p.nickname+'（'+p.username+'）';$('progress').replaceChildren();$('sessions').replaceChildren();for(const l of p.progress){const row=document.createElement('tr');cell(row,l.title);cell(row,l.completed?'已通过':'未通过');cell(row,l.bestScore);cell(row,l.attempts);$('progress').append(row)}$('detail').showModal();await loadSessions()}
async function loadSessions(){const data=await(await request('/players/'+encodeURIComponent(currentPlayer.id)+'/sessions?page='+sessionPage)).json();$('sessions').replaceChildren();const statuses={ACTIVE:'已开始 / 未提交',COMPLETED:'已通过',FAILED:'未通过',EXPIRED:'已过期'};for(const s of data.items){const row=document.createElement('tr');cell(row,s.title);cell(row,statuses[s.status]||s.status);cell(row,s.score);cell(row,s.elapsedSeconds==null?'—':s.elapsedSeconds+' 秒');cell(row,date(s.startedAt));const c=cell(row,'');if(s.submission){const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent='展开';pre.textContent=JSON.stringify(s.submission,null,2);details.append(summary,pre);c.append(details)}$('sessions').append(row)}$('sessionPage').textContent=sessionPage+' / '+Math.max(1,Math.ceil(data.total/50));$('sessionPrev').disabled=sessionPage<=1;$('sessionNext').disabled=sessionPage*50>=data.total}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginButton').disabled=true;$('message').textContent='';try{const r=await request('/login',{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});token=(await r.json()).accessToken;sessionStorage.setItem('adminToken',token);$('password').value='';showLoggedIn(true);await load()}catch(e){error(e)}finally{$('loginButton').disabled=false}};
$('logout').onclick=()=>{token='';sessionStorage.removeItem('adminToken');showLoggedIn(false);$('players').replaceChildren()};
$('refresh').onclick=()=>{page=1;load().catch(error)};
$('prev').onclick=()=>{page--;load().catch(error)};$('next').onclick=()=>{page++;load().catch(error)};
$('sessionPrev').onclick=()=>{sessionPage--;loadSessions().catch(error)};$('sessionNext').onclick=()=>{sessionPage++;loadSessions().catch(error)};
$('closeDetail').onclick=()=>$('detail').close();
$('export').onclick=async()=>{try{const blob=await(await request('/export?search='+encodeURIComponent($('search').value))).blob();const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='无菌方舟成绩.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){error(e)}};
showLoggedIn(!!token);if(token)load().catch(error);
</script></html>
