<!doctype html>
<html lang="zh-CN"><head>
<base href="/play/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#168ca3">
<meta name="description" content="无菌方舟 · 无菌操作训练">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="无菌方舟">
<link rel="apple-touch-icon" href="icons/Icon-192.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json"><title>无菌方舟</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#d8f5f6;color:#103f4a;font-family:system-ui,sans-serif;overscroll-behavior:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;gap:14px}
h1{font-size:28px;margin:0}p{color:#66858e;margin:0;line-height:1.7}button{border:0;border-radius:18px;background:#168ca3;color:white;font-size:18px;padding:14px 36px;cursor:pointer}
#rotate{display:none;position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:12px;right:12px;z-index:9999;text-align:center;pointer-events:none;font-size:13px;background:#f8fdfeeb;padding:8px;border-radius:12px;color:#103f4a}
@media (orientation:portrait) and (max-width:600px){#rotate{display:block}}
</style></head><body>
<div id="loading"><h1>无菌方舟</h1><p id="status">正在准备训练…<br>首次加载可能需要一些时间</p><button id="enter" hidden>进入方舟</button></div>
<div id="rotate">横屏体验更佳 · 可在 Safari 分享菜单中添加到主屏幕</div>
<script src="audio.js"></script><script src="flutter_bootstrap.js" async></script>
</body></html>
